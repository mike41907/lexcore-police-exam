name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Validate runtime data
        run: npm run validate

      - name: Check repository-site paths and required files
        shell: bash
        run: |
          test -f index.html
          test -f data/runtime.json
          test -f data/exams/question-bank.json
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon.svg
          if grep -nE '(^|["=])/(data|config|scripts|manifest|service-worker|icon)(/|["?#])' index.html promotion-warroom-v011.html; then
            echo "Found repository-root absolute asset path. Use a relative path for GitHub Pages repository sites."
            exit 1
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lexcore-pages"
          rsync -a --exclude '.git' --exclude 'node_modules' ./ "$RUNNER_TEMP/lexcore-pages/"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/lexcore-pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

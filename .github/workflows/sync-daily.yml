name: Daily official law and court sync
on:
  workflow_dispatch:
  schedule:
    # 23:20 UTC = 07:20 Asia/Taipei
    - cron: "20 23 * * *"
permissions:
  contents: write
concurrency:
  group: lexcore-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Run parser and data tests
        run: npm test
      - name: Sync official laws and Constitutional Court
        run: npm run sync:daily
      - name: Sync 6laws article titles and judgment index
        run: npm run sync:6laws
      - name: Re-run tests after index refresh
        run: npm test
      - name: Commit only validated data
        run: |
          git config user.name "lexcore-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): daily official sync"
            git push
          fi

name: Weekly official exam question sync
on:
  workflow_dispatch:
  schedule:
    # Sunday 21:20 UTC = Monday 05:20 Asia/Taipei
    - cron: "20 21 * * 0"
permissions:
  contents: write
concurrency:
  group: lexcore-exam-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive/PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf
      - name: Download and parse official CPU exam files
        run: python scripts/sync_exams.py
      - name: Commit parsed exam data
        run: |
          git config user.name "lexcore-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exams/
          if git diff --cached --quiet; then
            echo "No exam data changes."
          else
            git commit -m "chore(exams): sync official CPU question bank"
            git push
          fi
